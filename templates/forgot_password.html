<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Social</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/universal.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', path='/css/auth.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        .form-title {
            text-align: center;
            margin: 15px 0 5px;
            color: var(--text-color);
            font-size: 18px;
            font-weight: 600;
        }

        .form-subtitle {
            text-align: center;
            margin-bottom: 20px;
            color: var(--light-text);
            font-size: 14px;
        }

        .reset-link-container {
            background-color: #e9ecef;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            word-break: break-all;
        }

        .reset-link-container p {
            font-size: 12px;
            margin-bottom: 5px;
            color: #495057;
        }

        .reset-link {
            font-size: 11px;
            color: var(--accent-color);
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="form-container">
            <div class="logo">
                <h1>Social</h1>
            </div>
            
            <h2 class="form-title">Reset Your Password</h2>
            <p class="form-subtitle">We'll send you a link to reset your password.</p>

            {% if message %}
            <div class="alert success">
                {{ message }}
            </div>
            {% endif %}

            {% if reset_link %}
            <div class="reset-link-container">
                <p>Your reset link (for demo):</p>
                <a href="{{ reset_link }}" class="reset-link">{{ reset_link }}</a>
            </div>
            {% endif %}

            {% if error %}
            <div class="alert error">
                {{ error }}
            </div>
            {% endif %}

            <form action="/forgot-password" method="post">
                <div class="form-group">
                    <input type="email" name="email" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <button type="submit">Send Reset Link</button>
                </div>
            </form>
            
            <div class="back-to-login">
                <a href="/login">Back to login</a>
            </div>
        </div>
    </div>
</body>
</html>
