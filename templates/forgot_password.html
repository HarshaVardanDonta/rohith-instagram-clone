<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Social</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/styles.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <div class="form-container">
            <div class="logo">
                <h1>Social</h1>
            </div>
            
            <h2 class="form-title">Reset Your Password</h2>
            <p class="form-subtitle">We'll send you a link to reset your password.</p>

            {% if message %}
            <div class="alert success">
                {{ message }}
            </div>
            {% endif %}

            {% if reset_link %}
            <div class="reset-link-container">
                <p>Your reset link (for demo):</p>
                <a href="{{ reset_link }}" class="reset-link">{{ reset_link }}</a>
            </div>
            {% endif %}

            {% if error %}
            <div class="alert error">
                {{ error }}
            </div>
            {% endif %}

            <form action="/forgot-password" method="post">
                <div class="form-group">
                    <input type="email" name="email" placeholder="Email" required>
                </div>
                <div class="form-group">
                    <button type="submit">Send Reset Link</button>
                </div>
            </form>
            
            <div class="back-to-login">
                <a href="/login">Back to login</a>
            </div>
        </div>
    </div>
</body>
</html>
