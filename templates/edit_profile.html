<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customize Profile | PhotoShare</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/universal.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body class="is-authenticated">
    <header>
        <div class="header-container">
            <div class="logo">
                <h1>PhotoShare</h1>
            </div>
            <nav>
                <ul>
                    <li><a href="/home"><i class="fas fa-images"></i> Gallery</a></li>
                    <li><a href="/profile"><i class="fas fa-user-circle"></i> My Space</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="edit-profile-container">
            <h1>Personalize Your Profile</h1>
            
            {% if message %}
            <div class="alert success">
                <i class="fas fa-check-circle"></i> {{ message }}
            </div>
            {% endif %}

            {% if error %}
            <div class="alert error">
                <i class="fas fa-triangle-exclamation"></i> {{ error }}
            </div>
            {% endif %}

            <form action="/edit-profile" method="post" enctype="multipart/form-data">
                <div class="form-group profile-photo-upload">
                    <div class="current-photo">
                        {% if user_data.photoURL %}
                        <img src="{{ user_data.photoURL }}" alt="{{ user_data.displayName }}" id="profile-preview">
                        {% else %}
                        <div class="profile-placeholder" id="profile-preview-placeholder">
                            <i class="fas fa-user-astronaut"></i>
                        </div>
                        {% endif %}
                    </div>
                    <div class="upload-controls">
                        <label for="profile_photo">Update Profile Image</label>
                        <input type="file" id="profile_photo" name="profile_photo" accept="image/*" onchange="previewProfileImage()">
                    </div>
                </div>

                <div class="form-group">
                    <label for="username"><i class="fas fa-signature"></i> Username</label>
                    <input type="text" id="username" name="username" value="{{ user_data.username }}" required>
                </div>

                <div class="form-group">
                    <label for="full_name"><i class="fas fa-id-card"></i> Full Name</label>
                    <input type="text" id="full_name" name="full_name" value="{{ user_data.displayName }}" required>
                </div>

                <div class="form-group">
                    <button type="submit"><i class="fas fa-save"></i> Save Changes</button>
                </div>
            </form>
        </div>
    </main>

    <script>
        function previewProfileImage() {
            const fileInput = document.getElementById('profile_photo');
            if (fileInput.files && fileInput.files[0]) {
                const fileReader = new FileReader();
                
                fileReader.onload = function(event) {
                    const placeholder = document.getElementById('profile-preview-placeholder');
                    if (placeholder) {
                        const container = placeholder.parentElement;
                        const profileImg = document.createElement('img');
                        profileImg.id = 'profile-preview';
                        profileImg.src = event.target.result;
                        profileImg.alt = 'Profile Preview';
                        container.innerHTML = '';
                        container.appendChild(profileImg);
                    } else {
                        document.getElementById('profile-preview').src = event.target.result;
                    }
                };
                
                fileReader.readAsDataURL(fileInput.files[0]);
            }
        }
    </script>
</body>
</html>
