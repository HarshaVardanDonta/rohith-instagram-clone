<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Share Moment | PhotoShare</title>
    <link rel="stylesheet" href="/static/css/universal.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-analytics-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="/static/js/firebase-init.js"></script>
</head>
<body>
    <div class="container">
        <h1>Share Your Moment</h1>
        
        {% if error %}
        <div class="error-message">
            <i class="fas fa-exclamation-triangle"></i> {{ error }}
        </div>
        {% endif %}
        
        <form class="create-post-form" action="/create" method="post" enctype="multipart/form-data">
            <div class="preview-container" id="preview-section">
                <img id="image-preview" src="" alt="Image Preview" class="hidden">
                <div id="upload-prompt" class="upload-prompt">
                    <i class="fas fa-image"></i>
                    <p>Select an image to share</p>
                </div>
            </div>
            
            <div class="form-group custom-file-input">
                <label for="image">Image Upload</label>
                <label for="image" class="file-input-label">
                    <i class="fas fa-photo-film"></i> Browse Gallery
                </label>
                <input type="file" id="image" name="image" accept="image/*" required onchange="showImagePreview(event)">
            </div>
            
            <div class="form-group">
                <label for="description">
                    <i class="fas fa-feather"></i> Your Thoughts
                </label>
                <textarea id="description" name="description" placeholder="Tell the world about this moment..." required></textarea>
                <div class="character-count"><span id="char-count">0</span> / 2200</div>
            </div>
            
            <button type="submit" class="submit-btn">
                <i class="fas fa-share-alt"></i> Publish Moment
            </button>
        </form>
        
        <div class="navigation-buttons">
            <a href="/home" class="nav-button">
                <i class="fas fa-house"></i> Return to Feed
            </a>
        </div>
    </div>

    <script>
        function showImagePreview(event) {
            const fileReader = new FileReader();
            const previewImage = document.getElementById('image-preview');
            const uploadBox = document.getElementById('upload-prompt');
            
            fileReader.onload = function() {
                previewImage.src = fileReader.result;
                previewImage.classList.remove('hidden');
                uploadBox.classList.add('hidden');
            }
            
            fileReader.readAsDataURL(event.target.files[0]);
        }
        
        document.getElementById('description').addEventListener('input', function() {
            const textLength = this.value.length;
            document.getElementById('char-count').innerText = textLength;
            
            if (textLength > 2200) {
                document.getElementById('char-count').classList.add('text-danger');
            } else {
                document.getElementById('char-count').classList.remove('text-danger');
            }
        });
    </script>
</body>
</html>
