<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Social</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/universal.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        .home-container {
            max-width: 1000px;
            margin: 30px auto;
            padding: 0 20px;
        }
        
        .feed {
            background-color: var(--white);
            border-radius: 10px;
            padding: 25px;
            box-shadow: var(--shadow);
        }
        
        .feed h2 {
            font-size: 22px;
            margin-bottom: 15px;
            color: var(--primary-color);
        }
        
        .feed p {
            color: var(--light-text);
        }
    </style>
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-analytics-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <!-- Custom Firebase initialization -->
    <script src="{{ url_for('static', path='/js/firebase-init.js') }}"></script>
</head>
<body class="is-authenticated">
    <header>
        <div class="header-container">
            <div class="logo">
                <h1>Social</h1>
            </div>
            <div class="search">
                <input type="text" placeholder="Search">
            </div>
            <nav>
                <ul>
                    <li><a href="/home" class="active"><i class="fas fa-home"></i> Home</a></li>
                    <li><a href="/messages"><i class="fas fa-inbox"></i> Messages</a></li>
                    <li><a href="/create"><i class="fas fa-plus-square"></i> Create</a></li>
                    <li class="user-menu">
                        <div class="user-avatar">
                            {% if user_data.photoURL %}
                            <img src="{{ user_data.photoURL }}" alt="{{ user_data.displayName }}">
                            {% else %}
                            <i class="fas fa-user"></i>
                            {% endif %}
                        </div>
                        <div class="user-dropdown">
                            <div class="user-dropdown-header">
                                <div class="user-dropdown-name">{{ user_data.displayName }}</div>
                                <div class="user-dropdown-email">{{ user_data.email }}</div>
                            </div>
                            <ul class="user-dropdown-links">
                                <li><a href="/profile">
                                    <div class="menu-item-content">
                                        <i class="fas fa-user"></i>
                                        <span class="menu-item-text">Profile</span>
                                    </div>
                                    <i class="fas fa-chevron-right right-icon"></i>
                                </a></li>
                                <li><a href="/logout" class="logout-link">
                                    <div class="menu-item-content">
                                        <i class="fas fa-sign-out-alt"></i>
                                        <span class="menu-item-text">Logout</span>
                                    </div>
                                </a></li>
                            </ul>
                        </div>
                    </li>
                </ul>
            </nav>
        </div>
    </header>

    <main>
        <div class="home-container">
            <div class="feed">
                <h2>Welcome, {{ user_data.displayName }}</h2>
                <p>Your feed will appear here.</p>
            </div>
        </div>
    </main>
    
    <script src="{{ url_for('static', path='/js/auth.js') }}"></script>
</body>
</html>
