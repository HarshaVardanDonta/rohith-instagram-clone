<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | PhotoShare</title>
    <link rel="stylesheet" href="{{ url_for('static', path='/css/universal.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-analytics-compat.js"></script>
    <script src="{{ url_for('static', path='/js/firebase-init.js') }}"></script>
</head>
<body class="auth-body">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <div class="logo">
                    <h1>PhotoShare</h1>
                </div>
                <p class="auth-subtitle">Hello again! Access your gallery</p>
            </div>

            {% if message %}
            <div class="alert success">
                <i class="fas fa-check-circle"></i> {{ message }}
            </div>
            {% endif %}

            {% if error %}
            <div class="alert error">
                <i class="fas fa-triangle-exclamation"></i> {{ error }}
            </div>
            {% endif %}

            <form action="/login" method="post" class="auth-form">
                <div class="form-group">
                    <label for="email"><i class="fas fa-at"></i> Email Address</label>
                    <input type="email" id="email" name="email" placeholder="Your email address" required>
                </div>
                <div class="form-group password-group">
                    <label for="password"><i class="fas fa-key"></i> Password</label>
                    <div class="password-input-container">
                        <input type="password" id="password" name="password" placeholder="Your secure password" required>
                        <span class="password-toggle" onclick="revealPassword()">
                            <i class="fas fa-eye" id="toggleIcon"></i>
                        </span>
                    </div>
                </div>
                <div class="remember-forgot">
                    <div class="remember-me">
                        <input type="checkbox" id="remember" name="remember">
                        <label for="remember">Keep me signed in</label>
                    </div>
                    <div class="forgot-password">
                        <a href="/forgot-password">Reset password</a>
                    </div>
                </div>
                <div class="form-group">
                    <button type="submit" class="auth-button">
                        <i class="fas fa-right-to-bracket"></i> Enter Gallery
                    </button>
                </div>
            </form>
            
            <div class="or-divider">
                <span>OR</span>
            </div>
            
            <div class="social-auth">
                <button class="social-button google">
                    <i class="fab fa-google"></i> Sign in with Google
                </button>
            </div>
        </div>

        <div class="auth-switch">
            <p>First time here? <a href="/signup">Join our community</a></p>
        </div>
        
        <div class="auth-footer">
            <p>&copy; 2025 PhotoShare. Capturing moments together.</p>
        </div>
    </div>

    <script>
        function revealPassword() {
            const passwordInput = document.getElementById('password');
            const toggleIcon = document.getElementById('toggleIcon');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleIcon.classList.remove('fa-eye');
                toggleIcon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                toggleIcon.classList.remove('fa-eye-slash');
                toggleIcon.classList.add('fa-eye');
            }
        }
    </script>
</body>
</html>
